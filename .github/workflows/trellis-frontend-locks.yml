name: PhiOS Trellis frontend dependency locks

on:
  pull_request:
    paths:
      - ".github/workflows/trellis-frontend-locks.yml"
      - ".github/workflows/trellis-stage-bridge.yml"
      - "scripts/verify_frontend_locks.py"
      - "scripts/verify_frontend_build_outputs.py"
      - "scripts/audit_frontend_license_evidence.py"
      - "scripts/review_native_license_sources.py"
      - "scripts/frontend_release_preflight.py"
      - "tests/test_frontend_release_preflight.py"
      - "docs/PHIOS_RELEASE_PREFLIGHT_V0.69.md"
      - "tests/test_review_native_license_sources.py"
      - "dependency-locks/native-license-source-evidence.v0.68.json"
      - "docs/PHIOS_NATIVE_LICENSE_SOURCE_REVIEW_V0.68.md"
      - "tests/test_audit_frontend_license_evidence.py"
      - "docs/PHIOS_FRONTEND_LICENSE_EVIDENCE_V0.67.md"
      - "tests/test_verify_frontend_build_outputs.py"
      - "docs/PHIOS_TRELLIS_BUILD_REPLAY_V0.66.md"
      - "tests/test_verify_frontend_locks.py"
      - "docs/PHIOS_TRELLIS_DEPENDENCY_LOCKS_V0.65.md"
      - "dependency-locks/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/trellis-frontend-locks.yml"
      - ".github/workflows/trellis-stage-bridge.yml"
      - "scripts/verify_frontend_locks.py"
      - "scripts/verify_frontend_build_outputs.py"
      - "scripts/audit_frontend_license_evidence.py"
      - "scripts/review_native_license_sources.py"
      - "scripts/frontend_release_preflight.py"
      - "tests/test_frontend_release_preflight.py"
      - "docs/PHIOS_RELEASE_PREFLIGHT_V0.69.md"
      - "tests/test_review_native_license_sources.py"
      - "dependency-locks/native-license-source-evidence.v0.68.json"
      - "docs/PHIOS_NATIVE_LICENSE_SOURCE_REVIEW_V0.68.md"
      - "tests/test_audit_frontend_license_evidence.py"
      - "docs/PHIOS_FRONTEND_LICENSE_EVIDENCE_V0.67.md"
      - "tests/test_verify_frontend_build_outputs.py"
      - "docs/PHIOS_TRELLIS_BUILD_REPLAY_V0.66.md"
      - "tests/test_verify_frontend_locks.py"
      - "docs/PHIOS_TRELLIS_DEPENDENCY_LOCKS_V0.65.md"
      - "dependency-locks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-frontends:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout read-only PhiOS source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run deny-by-default npm closure contract tests
        run: python -m unittest discover -s tests -p "test_verify_frontend_locks.py" -v
      - name: Reject mismatched, tampered, or linked replayed build outputs
        run: python -m unittest discover -s tests -p "test_verify_frontend_build_outputs.py" -v
      - name: Reject untracked npm packages, missing dependency bytes and forged license evidence
        run: python -m unittest discover -s tests -p "test_audit_frontend_license_evidence.py" -v
      - name: Reject forged native license source pins and unreviewed release grants
        run: python -m unittest discover -s tests -p "test_review_native_license_sources.py" -v
      - name: Reject mismatched evidence and forged release/installer authority
        run: python -m unittest discover -s tests -p "test_frontend_release_preflight.py" -v
      - name: Checkout immutable Vessie source
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/SuperPhiVessel
          ref: 69a558ea2d1e8b361e05ded9bed4fc27b32e30cd
          path: .ci-sources/SuperPhiVessel
          persist-credentials: false
      - name: Checkout immutable ThinkTank source
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/think-tank
          ref: 655d96f7ff892c9989f75cf874e74689f7694127
          path: .ci-sources/think-tank
          persist-credentials: false
      - name: Node/npm versions used for the reviewed graph capture
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Validate exact source manifests and stage reviewed lock snapshots only
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"
          mkdir -p "$RUNNER_TEMP/phios-closure-receipts"
          python scripts/verify_frontend_locks.py --app vessie-web \
            --checkout .ci-sources/SuperPhiVessel --prepare \
            > "$RUNNER_TEMP/phios-closure-receipts/vessie-verified-lock.json"
          python scripts/verify_frontend_locks.py --app thinktank-web \
            --checkout .ci-sources/think-tank --prepare \
            > "$RUNNER_TEMP/phios-closure-receipts/thinktank-verified-lock.json"
      - name: Install Vessie frozen npm graph (before build outputs/caches exist)
        working-directory: .ci-sources/SuperPhiVessel/apps/vessie-web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = 4e0ac5153f3bc47cd78b4f5cfa42c2ede4dbfef8110a2d5deda49d5c81bd6c2a
      - name: Install ThinkTank frozen npm graph (before build outputs/caches exist)
        working-directory: .ci-sources/think-tank
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = 1dc173319bd4e20a1441147563a71e2a2c01ab6c13606f6f9e774ed3cad221c6
      - name: Inventory installed npm packages and hash license evidence before React builds
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_frontend_license_evidence.py --app vessie-web \
            --checkout .ci-sources/SuperPhiVessel \
            --report "$RUNNER_TEMP/phios-closure-receipts/vessie-license-evidence.json"
          python scripts/audit_frontend_license_evidence.py --app thinktank-web \
            --checkout .ci-sources/think-tank \
            --report "$RUNNER_TEMP/phios-closure-receipts/thinktank-license-evidence.json"
      - name: Resolve immutable upstream license files and preserve unresolved LZMA declaration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/review_native_license_sources.py \
            --vessie-census "$RUNNER_TEMP/phios-closure-receipts/vessie-license-evidence.json" \
            --thinktank-census "$RUNNER_TEMP/phios-closure-receipts/thinktank-license-evidence.json" \
            --report "$RUNNER_TEMP/phios-closure-receipts/native-license-source-review.json"
      - name: Build Vessie from audited frozen npm graph
        working-directory: .ci-sources/SuperPhiVessel/apps/vessie-web
        run: |
          npm run build -- --base ./
          test -f ../../site/vessie/index.html
      - name: Build ThinkTank from audited frozen npm graph
        working-directory: .ci-sources/think-tank
        run: |
          npm run build -- --base ./
          test -f dist/index.html
      - name: Make clean independent source trees from EXACT reviewed git commits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phios-replay-vessie" "$RUNNER_TEMP/phios-replay-thinktank"
          test "$(git -C .ci-sources/SuperPhiVessel rev-parse HEAD)" = 69a558ea2d1e8b361e05ded9bed4fc27b32e30cd
          test "$(git -C .ci-sources/think-tank rev-parse HEAD)" = 655d96f7ff892c9989f75cf874e74689f7694127
          git -C .ci-sources/SuperPhiVessel archive 69a558ea2d1e8b361e05ded9bed4fc27b32e30cd | tar -xf - -C "$RUNNER_TEMP/phios-replay-vessie"
          git -C .ci-sources/think-tank archive 655d96f7ff892c9989f75cf874e74689f7694127 | tar -xf - -C "$RUNNER_TEMP/phios-replay-thinktank"
          test ! -e "$RUNNER_TEMP/phios-replay-vessie/apps/vessie-web/package-lock.json"
          test -s "$RUNNER_TEMP/phios-replay-thinktank/package-lock.json"
          test "$(sha256sum "$RUNNER_TEMP/phios-replay-vessie/apps/vessie-web/package.json" | cut -d' ' -f1)" = 6bdbd921cea13474fc2b6fd5cbe02765345a48e345a9cc57913e9b0693e9664e
          test "$(sha256sum "$RUNNER_TEMP/phios-replay-thinktank/package.json" | cut -d' ' -f1)" = 1ca7b23585f4bbb6cbd83a5248c03bb106568cb0af9d69faf138b8d3191f2eb7
          cp dependency-locks/vessie-web/package-lock.json "$RUNNER_TEMP/phios-replay-vessie/apps/vessie-web/package-lock.json"
          cmp -s dependency-locks/thinktank-web/package-lock.json "$RUNNER_TEMP/phios-replay-thinktank/package-lock.json"
          test "$(sha256sum "$RUNNER_TEMP/phios-replay-vessie/apps/vessie-web/package-lock.json" | cut -d' ' -f1)" = 4e0ac5153f3bc47cd78b4f5cfa42c2ede4dbfef8110a2d5deda49d5c81bd6c2a
          test "$(sha256sum "$RUNNER_TEMP/phios-replay-thinktank/package-lock.json" | cut -d' ' -f1)" = 1dc173319bd4e20a1441147563a71e2a2c01ab6c13606f6f9e774ed3cad221c6
      - name: Rebuild Vessie with clean npm ci in unrelated source tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/phios-replay-vessie/apps/vessie-web"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
          npm run build -- --base ./
          test -f ../../site/vessie/index.html
      - name: Rebuild ThinkTank with clean npm ci in unrelated source tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/phios-replay-thinktank"
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
          npm run build -- --base ./
          test -f dist/index.html
      - name: Compare complete frontend output file sets and exact SHA-256 hashes
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          python scripts/verify_frontend_build_outputs.py --app vessie-web \
            --first .ci-sources/SuperPhiVessel/site/vessie \
            --second "$RUNNER_TEMP/phios-replay-vessie/site/vessie" \
            --report "$RUNNER_TEMP/phios-closure-receipts/vessie-double-build.json" || failures=1
          python scripts/verify_frontend_build_outputs.py --app thinktank-web \
            --first .ci-sources/think-tank/dist \
            --second "$RUNNER_TEMP/phios-replay-thinktank/dist" \
            --report "$RUNNER_TEMP/phios-closure-receipts/thinktank-double-build.json" || failures=1
          test "$failures" -eq 0
      - name: Compose fail-closed frontend release review packet from same-run CI receipts
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/phios-closure-receipts"
          python scripts/frontend_release_preflight.py \
            --receipts-dir "$evidence" \
            --report "$evidence/frontend-release-hold.json"
          python - "$evidence/frontend-release-hold.json" <<'PY'
          import json,sys
          packet=json.load(open(sys.argv[1],encoding="utf-8"))
          assert packet["status"]=="HOLD_FOR_OPERATOR_REVIEW"
          assert packet["release_blocker_count"]==7
          assert packet["license_redistribution_cleared"] is False
          assert packet["installer_packaging_authorized"] is False
          assert packet["external_done"] is False
          PY
      - name: Negative control forbids converting evidence into release authorization
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/phios-closure-receipts"
          if python scripts/frontend_release_preflight.py \
            --receipts-dir "$evidence" \
            --report "$evidence/frontend-release-denied.json" \
            --require-release-authority; then
            echo "UNSAFE: evidence preflight granted release authority" >&2
            exit 1
          fi
          python - "$evidence/frontend-release-denied.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["status"]=="HOLD_FOR_OPERATOR_REVIEW"
          assert not any(p[k] for k in ("release_authority_present",
              "license_redistribution_cleared","installer_packaging_authorized",
              "phios_launch_authorized","external_done"))
          PY
          echo "EXPECTED_FAIL_CLOSED: evidence not release authorization"
      - name: Retain release hold packet and dependency evidence for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phios-v069-evidence-release-hold-${{ github.run_id }}
          path: ${{ runner.temp }}/phios-closure-receipts/*.json
          if-no-files-found: ignore
          retention-days: 7
