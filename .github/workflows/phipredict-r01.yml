name: PhiPredict R0.1-R0.2

on:
  pull_request:
    paths:
      - 'phios/predict.py'
      - 'phios/predict_source.py'
      - 'tests/test_predict_r01.py'
      - 'tests/test_predict_r02.py'
      - 'docs/PHIPREDICT_R01.md'
      - 'docs/PHIPREDICT_R02.md'
      - '.github/workflows/phipredict-r01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predict-offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: python -m pip install pytest==9.0.2 ruff==0.15.6 mypy==1.19.1
      - name: Ruff
        run: ruff check phios/predict.py phios/predict_source.py tests/test_predict_r01.py tests/test_predict_r02.py
      - name: Mypy
        run: mypy phios/predict.py phios/predict_source.py --ignore-missing-imports
      - name: Focused tests
        run: python -m pytest -q tests/test_predict_r01.py tests/test_predict_r02.py
