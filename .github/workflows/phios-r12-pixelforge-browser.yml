name: PhiOS R12 PixelForge separate-origin browser acceptance

on:
  pull_request:
    paths:
      - 'phishell/src/components/PixelForgeBridgePilot.tsx'
      - 'phishell/src/PhiShell.tsx'
      - 'phishell/src/shell/pixelForgeBridgeSelection*'
      - 'phishell/host/pixelForgeR12TwoOriginBrowser.mjs'
      - '.github/workflows/phios-r12-pixelforge-browser.yml'
  push:
    branches: [main]
    paths:
      - 'phishell/src/components/PixelForgeBridgePilot.tsx'
      - 'phishell/src/PhiShell.tsx'
      - 'phishell/src/shell/pixelForgeBridgeSelection*'
      - 'phishell/host/pixelForgeR12TwoOriginBrowser.mjs'
      - '.github/workflows/phios-r12-pixelforge-browser.yml'

permissions:
  contents: read

jobs:
  real-two-origin-pixel:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout exact PhiOS candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact merged PixelForge R12 PR 89 source
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/parallax-pixelforge
          ref: b1c6314da005de801ba3b0417ffe4b4abe461828
          path: .interop/pixelforge
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify pinned source, syntax and no floating checkout
        run: |
          test "$(git -C .interop/pixelforge rev-parse HEAD)" = "b1c6314da005de801ba3b0417ffe4b4abe461828"
          node --check phishell/host/pixelForgeR12TwoOriginBrowser.mjs
          node --check .interop/pixelforge/vr-studio/phios-bridge-client.js

      - name: Require actual Chrome
        run: command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Assemble actual public PixelForge project Pages from pinned merged source
        run: |
          npm --prefix .interop/pixelforge/site install --no-audit --no-fund
          npm --prefix .interop/pixelforge/site run build
          test -f .interop/pixelforge/dist/vr-studio/index.html
          test -f .interop/pixelforge/dist/vr-studio/phios-bridge-client.js
          test -f .interop/pixelforge/dist/vr-studio/phios-bridge-ui.js

      - name: Install pinned PhiShell dependencies
        working-directory: phishell
        run: npm ci --no-audit

      - name: Test assembled Pages path with exact origins in real Chrome
        run: node phishell/host/pixelForgeR12TwoOriginBrowser.mjs
