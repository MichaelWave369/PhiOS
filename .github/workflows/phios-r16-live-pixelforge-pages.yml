name: PhiOS R16 live PixelForge Pages framing audit

on:
  pull_request:
    paths:
      - 'phishell/host/pixelForgeR12TwoOriginBrowser.mjs'
      - '.github/workflows/phios-r16-live-pixelforge-pages.yml'
  push:
    branches: [main]
    paths:
      - 'phishell/host/pixelForgeR12TwoOriginBrowser.mjs'
      - '.github/workflows/phios-r16-live-pixelforge-pages.yml'

permissions:
  contents: read

jobs:
  public-pages-live-framing:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout exact PhiOS test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact merged PixelForge bridge source for integrity comparison
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/parallax-pixelforge
          ref: b1c6314da005de801ba3b0417ffe4b4abe461828
          path: .interop/pixelforge
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify no drifting source or malformed browser test
        run: |
          test "$(git -C .interop/pixelforge rev-parse HEAD)" = "b1c6314da005de801ba3b0417ffe4b4abe461828"
          node --check phishell/host/pixelForgeR12TwoOriginBrowser.mjs
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Build exact reviewed PixelForge artifact as offline reference
        run: |
          npm --prefix .interop/pixelforge/site install --no-audit --no-fund
          npm --prefix .interop/pixelforge/site run build

      - name: Install pinned PhiShell dependencies
        working-directory: phishell
        run: npm ci --no-audit

      - name: Audit LIVE public GitHub Pages headers, source integrity and Chrome embed consent
        env:
          PHIOS_R16_LIVE_PAGES: '1'
        run: node phishell/host/pixelForgeR12TwoOriginBrowser.mjs
