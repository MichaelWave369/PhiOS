name: Fixture-free OS candidate (unpublished)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-free-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the exact source with production profile and no QA fixtures
        run: |
          set -euo pipefail
          mkdir -p dist/fixture-free
          builder_image=$(python3 -c 'import json; print(json.load(open("packaging/linux/release.json"))["builder_image"])')
          docker pull "$builder_image"
          docker image inspect "$builder_image" > dist/fixture-free/builder-image.json
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$GITHUB_WORKSPACE/dist/fixture-free:/artifacts" \
            -w "$GITHUB_WORKSPACE" \
            -e PHIOS_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            -e PHIOS_OUTPUT_DIR=/artifacts -e PHIOS_CI_SMOKE=0 \
            "$builder_image" bash packaging/linux/build-linux.sh 2>&1 | tee dist/fixture-free/build.log
      - name: Validate SBOM and qualify this unmodified ISO through normal PAM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf python3-pil python3-venv
          if [[ -e /dev/kvm ]]; then
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod g+rw /dev/kvm
          fi
          python3 -m venv "$RUNNER_TEMP/phios-sbom-validator"
          "$RUNNER_TEMP/phios-sbom-validator/bin/python" -m pip install jsonschema==4.26.0
          "$RUNNER_TEMP/phios-sbom-validator/bin/python" packaging/linux/validate_sbom.py dist/fixture-free/sbom.cdx.json
          python3 packaging/linux/tests/qemu_preview.py \
            --iso dist/fixture-free/phios-linux-0.1.0-alpha.1-x86_64.iso \
            --source "$(cat dist/fixture-free/source-commit.txt)" \
            --output "$RUNNER_TEMP/phios-preview"
      - name: Install and recover the exact normal ISO through production commands
        run: |
          python3 packaging/linux/tests/qemu_install.py \
            --fixture-free --recovery \
            --iso dist/fixture-free/phios-linux-0.1.0-alpha.1-x86_64.iso \
            --source "$(cat dist/fixture-free/source-commit.txt)" \
            --output "$RUNNER_TEMP/phios-normal-installed"
      - name: Preserve display evidence even on failure
        if: always()
        run: |
          /usr/bin/python3 -I - <<'PY'
          from pathlib import Path
          import os
          files = [p for name in ["phios-preview","phios-normal-installed"] for p in Path(os.environ['RUNNER_TEMP'], name).glob('*.ppm')]
          if files:
              from PIL import Image
              for path in files:
                  Image.open(path).save(path.with_suffix('.png'))
          else:
              print('No VM display captures exist; retain the earlier failure logs.')
          PY
      - name: Emit bounded qualification metadata for review
        if: always()
        run: |
          /usr/bin/python3 -I - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          source = os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', source)
          roots = [('PhiOS/PhiOS/dist/fixture-free', Path('dist/fixture-free'))]
          roots += [('_temp/' + name, Path(os.environ['RUNNER_TEMP'], name)) for name in ["phios-preview","phios-normal-installed"]]
          payload = {'schema_version': 'phios.ci-review-metadata.v1', 'source_commit': source,
                     'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'files': {}, 'reports': {}, 'inventory_counts': {},
                     'producer_metadata_only': True, 'review_archive_independently_verified': False, 'release_ready': False}
          counts = {'native-packages.json': 'native', 'python-packages.json': 'python',
                    'javascript-packages.json': 'installed_npm', 'javascript-bundled-packages.json': 'bundled_frontend_origins'}
          for prefix, root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.iterdir()):
                  if path.suffix not in {'.json', '.txt', '.log', '.png'} and path.name != 'SHA256SUMS':
                      continue
                  if path.is_symlink() or not path.is_file() or path.stat().st_size > 64 * 1024 * 1024:
                      raise ValueError('unexpected or oversized review evidence file')
                  with path.open('rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  payload['files'][prefix + '/' + path.name] = {'sha256': digest, 'size': path.stat().st_size}
                  if path.suffix != '.json':
                      continue
                  if path.stat().st_size > 4 * 1024 * 1024:
                      raise ValueError('review JSON exceeds its bound')
                  data = json.loads(path.read_text())
                  if path.name in {'provenance.json', 'boot-evidence.json', 'preview-evidence.json', 'installed-evidence.json'}:
                      if data.get('source_commit') != source:
                          raise ValueError('review source identity differs from this CI source')
                      payload['reports'][prefix + '/' + path.name] = {k: v for k, v in data.items() if k not in {'command', 'commands', 'artifacts'}}
                  elif path.name in counts:
                      if not isinstance(data, list):
                          raise ValueError('review inventory is not a list')
                      payload['inventory_counts'][counts[path.name]] = len(data)
                  elif path.name == 'sbom.cdx.json':
                      payload['inventory_counts']['cyclonedx_components'] = len(data['components'])
                  elif path.name == 'third-party-notices.json':
                      payload['inventory_counts']['supplier_notice_files'] = len(data['files'])
                  elif path.name == 'source-review.json':
                      payload['first_party_source_archive'] = data['first_party_source_archive']
                      payload['source_delivery_reviewed'] = data['third_party_source_compliance_reviewed']
          wire = json.dumps(payload, sort_keys=True, separators=(',', ':'))
          if len(wire.encode()) > 60000:
              raise ValueError('compact review metadata exceeds its bound')
          print('PHIOS_REVIEW_METADATA:' + wire)
          PY
      - name: Preserve unpublished candidate and exact provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phios-fixture-free-candidate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            dist/fixture-free/
            ${{ runner.temp }}/phios-preview/*.log
            ${{ runner.temp }}/phios-preview/*.json
            ${{ runner.temp }}/phios-preview/*.png
            ${{ runner.temp }}/phios-normal-installed/*.log
            ${{ runner.temp }}/phios-normal-installed/*.json
            ${{ runner.temp }}/phios-normal-installed/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve compact review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phios-fixture-free-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            dist/fixture-free/*.json
            dist/fixture-free/*.txt
            dist/fixture-free/*.log
            dist/fixture-free/SHA256SUMS
            ${{ runner.temp }}/phios-preview/*.log
            ${{ runner.temp }}/phios-preview/*.json
            ${{ runner.temp }}/phios-preview/*.png
            ${{ runner.temp }}/phios-normal-installed/*.log
            ${{ runner.temp }}/phios-normal-installed/*.json
            ${{ runner.temp }}/phios-normal-installed/*.png
          if-no-files-found: warn
          retention-days: 7
