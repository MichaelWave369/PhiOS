name: PhiOS VM Recovery Evidence

on:
  pull_request:
    paths:
      - 'packaging/linux/tests/qemu_failure_evidence.py'
      - 'packaging/linux/tests/qemu_boot.py'
      - 'packaging/linux/tests/qemu_install.py'
      - 'packaging/linux/tests/qemu_normal_live.py'
      - 'tests/test_qemu_failure_evidence.py'
      - 'docs/os/QEMU_RECOVERY_EXIT_TRIAGE.md'
      - '.github/workflows/qemu-recovery-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-diagnostic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused checks
        run: python -m pip install pytest==9.0.2 ruff==0.15.6
      - name: Static check
        run: |
          python -m compileall -q packaging/linux/tests/qemu_failure_evidence.py packaging/linux/tests/qemu_boot.py packaging/linux/tests/qemu_install.py packaging/linux/tests/qemu_normal_live.py
          ruff check packaging/linux/tests/qemu_failure_evidence.py tests/test_qemu_failure_evidence.py
      - name: Run offline regression tests
        run: python -m pytest -q tests/test_qemu_failure_evidence.py
