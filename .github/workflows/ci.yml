name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Verify external Python build frontend
        run: |
          python - <<'PY'
          from importlib.util import find_spec
          from pathlib import Path

          spec = find_spec("build")
          assert spec is not None and spec.origin, "python-build frontend is unavailable"

          origin = Path(spec.origin).resolve()
          repo_build = (Path.cwd() / "build").resolve()
          assert origin != repo_build / "__init__.py", (
              f"repository build shim shadows python-build frontend: {origin}"
          )
          print(f"python-build frontend: {origin}")
          PY
          python -m build --version
      - name: Ruff
        run: ruff check phios/
      - name: Mypy
        run: mypy phios/ --ignore-missing-imports
      - name: Run tests
        run: pytest -q
      - name: Enforce no telemetry policy
        run: bash scripts/policy_no_telemetry_runtime.sh


  installed-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel from repository metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist-test
          ls -lah dist-test
      - name: Verify wheel contains required runtime packages
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist-test").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"

          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())

          required = {
              "phios/network/__init__.py",
              "phios/network/discovery.py",
              "phios/network/exchange.py",
              "phios/shell/phi_session.py",
          }
          missing = sorted(required - names)
          assert not missing, f"wheel missing required runtime files: {missing}"
          PY
      - name: Smoke-test installed wheel outside source tree
        run: |
          python -m venv /tmp/phios-wheel-smoke
          /tmp/phios-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/phios-wheel-smoke/bin/python -m pip install dist-test/*.whl
          cd /tmp
          /tmp/phios-wheel-smoke/bin/python - <<'PY'
          import phios.network
          import phios.shell.phi_session

          print("installed PhiOS wheel imports succeeded")
          PY


  memory-vector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install governed-memory vector backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,memory-vector]"
      - name: Run governed-memory vector tests
        run: |
          pytest -q \
            tests/test_memory_embeddings_v01.py \
            tests/test_memory_sqlite_vec_v01.py \
            tests/test_memory_semantic_retrieval_v01.py


  ledger-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux worker isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          bwrap --version
      - name: Install pinned Ledger report backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ledger-reports]"
          python -c "import duckdb; assert duckdb.__version__ == '1.5.5'"
      - name: Run native DuckDB and isolation tests
        run: |
          pytest -q \
            tests/test_ledger_report_contract_v01.py \
            tests/test_ledger_report_duckdb_v01.py
