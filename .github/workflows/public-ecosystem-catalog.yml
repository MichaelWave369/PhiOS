name: PhiOS public ecosystem catalog

on:
  pull_request:
    paths:
      - "phishell/src/ecosystem/**"
      - "phishell/src/components/EcosystemCatalog.tsx"
      - "phishell/src/components/XiCommonsSourceTile.tsx"
      - "tests/test_xi_commons_public_tile.py"
      - "phishell/src/components/AppLauncher.tsx"
      - "phishell/src/styles.css"
      - "scripts/sync_public_ecosystem_catalog.py"
      - "scripts/verify_ecosystem_source_reviews.py"
      - "scripts/verify_ecosystem_app_candidates.py"
      - "tests/test_ecosystem_app_candidates.py"
      - "tests/test_public_ecosystem_catalog.py"
      - "tests/test_ecosystem_source_reviews.py"
      - ".github/workflows/public-ecosystem-catalog.yml"
  push:
    branches: [main]
    paths:
      - "phishell/src/ecosystem/**"
      - "phishell/src/components/EcosystemCatalog.tsx"
      - "phishell/src/components/XiCommonsSourceTile.tsx"
      - "tests/test_xi_commons_public_tile.py"
      - "phishell/src/components/AppLauncher.tsx"
      - "phishell/src/styles.css"
      - "scripts/sync_public_ecosystem_catalog.py"
      - "scripts/verify_ecosystem_source_reviews.py"
      - "scripts/verify_ecosystem_app_candidates.py"
      - "tests/test_ecosystem_app_candidates.py"
      - "tests/test_public_ecosystem_catalog.py"
      - "tests/test_ecosystem_source_reviews.py"
      - ".github/workflows/public-ecosystem-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-catalog-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check bundled public-only offline catalog WITHOUT network
        run: python scripts/sync_public_ecosystem_catalog.py --check
      - name: Validate pinned source-family notes and refuse readiness promotion
        run: python -m scripts.verify_ecosystem_source_reviews
      - name: Reject private, foreign, malformed and permission-promoting entries
        run: python -m unittest discover -s tests -p "test_public_ecosystem_catalog.py" -v
      - name: Negative tests for forged source-family review authority and foreign sources
        run: python -m unittest discover -s tests -p "test_ecosystem_source_reviews.py" -v
      - name: Verify v0.25 candidate manifests without registering, installing or executing apps
        run: python scripts/verify_ecosystem_app_candidates.py
      - name: Fail closed on forged candidate grants, source drift and invalid build claims
        run: python -m unittest discover -s tests -p "test_ecosystem_app_candidates.py" -v
      - name: Verify Xi-Phi public-only launch boundary
        run: python -m unittest discover -s tests -p "test_xi_commons_public_tile.py" -v
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PhiShell only
        working-directory: phishell
        run: npm ci --no-audit --no-fund
      - name: Run existing shell tests
        working-directory: phishell
        run: npm test
      - name: Type-check and bundle entire offline ecosystem into PhiShell
        working-directory: phishell
        run: npm run build
      - name: Confirm public catalog is embedded in compiled ISO-bound shell assets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync} from 'node:fs';
          import {join} from 'node:path';
          const dir='phishell/dist/assets';
          const js=readdirSync(dir).filter(x=>x.endsWith('.js')).map(x=>readFileSync(join(dir,x),'utf8')).join('\n');
          for(const entry of ['SuperPhiVessel','think-tank','Domistika','SOURCE_ONLY','launch_authorized','phios.vessie-web','phios.thinktank-web','HELD_FOR_OPERATOR_REVIEW','SOURCE FAMILY: UNREVIEWED','README ONLY','PhiARK','GitPorch','LENZ']){
            if(!js.includes(entry))throw Error('BUNDLED_ECOSYSTEM_MISSING_'+entry);
          }
          if(!readdirSync('phishell/dist').includes('index.html'))throw Error('PHISHELL_BUILD_MISSING');
          for(const invariant of ['Sovereign Commons Gateway','R17: BLOCKED','R18: NOT RUN','xi-vessel-bridge']) {
            if(!js.includes(invariant))throw Error('XI_PUBLIC_SOURCE_TILE_MISSING_'+invariant);
          }
          console.log('PHIOS_PUBLIC_ECOSYSTEM_EMBEDDED: SOURCE_ONLY; no installed/execution authority');
          NODE
