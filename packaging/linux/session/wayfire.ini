# Wayfire 0.11 public configuration options.
[core]
plugins = autostart command decoration move resize place grid vswitch wm-actions session-lock
vwidth = 3
vheight = 3
close_top_view = <super> KEY_Q | <alt> KEY_F4

[autostart]
autostart_wf_shell = false
phios = /usr/lib/phishell/session-ready

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot phi
binding_linux_terminal = <super> <alt> KEY_ENTER
command_linux_terminal = foot
binding_launcher = <super> KEY_SPACE
command_launcher = phios-launcher
binding_shell = <super> KEY_P
command_shell = phios-open-shell
binding_lock = <super> KEY_L
command_lock = phios-lock
binding_network = <super> KEY_N
command_network = foot nmtui

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT
